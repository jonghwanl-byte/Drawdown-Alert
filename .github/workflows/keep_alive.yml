name: Keep Alive

# 저장소에 60일간 활동이 없으면 GitHub가 workflow 를 자동 비활성화합니다.
# 매월 1일·16일에 작은 커밋을 남겨 이를 방지합니다.
on:
  schedule:
    - cron: "0 3 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update keep-alive file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keep-alive.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: keep-alive $(date -u +%F)"
            git push
          fi
